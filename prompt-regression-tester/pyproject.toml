[project]
name = "prompt-regression-tester"
version = "0.1.0"
description = "Unit tests for prompts: assert on LLM outputs (contains, regex, JSON, length), run suites against any model and diff runs to catch regressions."
requires-python = ">=3.10"
authors = [{name = "Martin Njiru"}]
license = {text = "MIT"}

[tool.setuptools]
packages = ["promptreg"]
